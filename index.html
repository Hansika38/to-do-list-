<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart To-Do List</title>
  <link rel="stylesheet" href="todolist.css">
</head>
<body>
  <div class="container">
    <h1>Smart To-Do List</h1>

    <div class="task-inputs">
      <input type="text" id="task-input" placeholder="Add a new task...">
      <select id="priority-select">
        <option value="high">High 🔴</option>
        <option value="medium" selected>Medium 🟡</option>
        <option value="low">Low 🟢</option>
      </select>
      <button id="add-btn">Add</button>
    </div>

    <div class="filters">
      <button id="filter-all" class="filter-btn active">All</button>
      <button id="filter-pending" class="filter-btn">Pending</button>
      <button id="filter-completed" class="filter-btn">Completed</button>
    </div>

    <ul id="task-list"></ul>

    <div class="list-footer">
      <span id="task-counter">0 tasks pending</span>
      <button id="clear-completed-btn" class="clear-btn">Clear Completed</button>
    </div>

    <div class="dark-mode-toggle">
      <label class="switch">
        <input type="checkbox" id="dark-mode-checkbox">
        <span class="slider"></span>
      </label>
      <span class="toggle-text">Dark Mode</span>
    </div>
  </div>

  <script src="todolist.js"></script>
</body>
</html>
